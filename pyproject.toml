[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veda"
version = "0.1.0"
description = "Project Veda: a small, provable reflection pipeline (Veritas Aeterna, Project Alpha, Mental Project, Peaceful Division)"
authors = [{name = "Ryan Espinosa"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[tool.setuptools]
packages = ["veda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
